,result:"抽樣就看出問題了,你省下一天。"},{p:.4,effects:{boss:-2},result:"抽樣有偏差,結論要重講。"}]}],brief:"工程師說查資料要排隊,得等一晚。"},{id:"e_gacha_complaint",kind:"客訴",from:"玩家論壇",weight:2,minDay:3,title:"「抽卡機率好像不對」",body:"三位玩家貼出自己的抽卡紀錄,認為實際機率低於公告。討論串已經 200 則回覆,而且還在長。",deadline:2,ignore:{effects:{trust:-6,retention:-1},result:"討論串變成 600 則,標題多了「求回應」。",habit:{ignored_players:1}},options:[{label:"公布完整機率驗證報告",ap:3,outcomes:[{p:.7,effects:{trust:8,retention:1},result:"報告很清楚,討論串轉為「營運好認真」。",habit:{transparency:1}},{p:.3,effects:{trust:-3},result:"報告裡有個小數點被指出,新一輪討論開始。",habit:{transparency:1}}]},{label:"先發安撫公告,說會調查",ap:1,outcomes:[{p:1,effects:{trust:2},result:"公告寫「持續關注」,玩家寫「持續觀望」。",followUp:{eventId:"e_gacha_followup",afterDays:2}}]},{label:"不回應,看看會不會自己沉",ap:0,outcomes:[{p:.5,result:"討論串自己沉了。",habit:{ignored_players:1}},{p:.5,effects:{trust:-8,retention:-2},result:"有人做了統計圖,被轉到別的平台。",habit:{ignored_players:1}}]}],brief:"玩家懷疑抽卡機率被偷偷調低,正在論壇吵。"},{id:"e_gacha_followup",kind:"客訴",from:"玩家論壇",title:"「公告說會調查,結果呢?」",body:"安撫公告發出兩天了。有玩家整理了時間軸:「第 0 天:說會調查。第 2 天:沒有下文。」",deadline:1,ignore:{effects:{trust:-7},result:"時間軸更新到「第 3 天:沒有下文」,按讚數破千。"},options:[{label:"公布調查結果與改善方式",ap:2,outcomes:[{p:1,effects:{trust:5},result:"有交代就好,玩家要的常常只是這個。"}]}],brief:"你說過會調查,玩家在問結果。"},{id:"e_tech_deadline",kind:"技術",from:"工程師 阿宏",title:"技術:「提早上線?可以,但是……」",body:"老闆想把活動提早上線。阿宏看著排程表,沉默了很久:「提早兩天?可以。但我不保證不會有事。」",deadline:1,ignore:{effects:{trust:0,boss:-1},result:"排程維持原樣,阿宏默默加了一個備註。"},options:[{label:"同意提早,風險自己扛",ap:0,outcomes:[{p:1,effects:{boss:3},setFlag:"rushedTech",result:"林總很滿意。阿宏在筆記本上寫了什麼,你沒看到。",habit:{rushed:1,yes_man:1}}]},{label:"堅持原時程",ap:1,outcomes:[{p:1,effects:{boss:-3},result:"阿宏點頭,像是鬆了一口氣。林總的表情則沒有。",habit:{pushback:1}}]},{label:"一起排優先順序,砍掉不必要的功能",ap:2,outcomes:[{p:1,effects:{trust:2,boss:1},result:"你們把 8 個功能砍到 5 個。最後一個是林總想要的。"}]}],brief:"活動要提早上線,工程師擔心來不及測試。"},{id:"e_bug_after_launch",kind:"技術",from:"客服回報",title:"活動上線後的 bug",body:"玩家回報:領獎按鈕點了沒反應。工程師說其實有反應,只是要等 40 秒。玩家等 5 秒就點第二次,然後領了兩次,或是零次。",deadline:1,ignore:{effects:{trust:-7,players:-3},result:"客服電話響個不停。"},options:[{label:"公告加補償,道歉先行",ap:2,outcomes:[{p:1,effects:{trust:3},result:"補償到位,玩家說「好吧,下次別這樣」。"}]},{label:"請技術緊急熱修",ap:1,outcomes:[{p:.6,effects:{trust:4},result:"熱修成功,玩家以為本來就這樣設計的。"},{p:.4,effects:{trust:-3},result:"修好一個,另一個冒出來。"}]}],brief:"活動上線後,領獎按鈕出問題了。"},{id:"e_social_meme",kind:"輿情",from:"社群監控",weight:3,title:"迷因:「獎勵 = 泡麵加衛生紙」",body:"玩家做了一張迷因圖,嘲諷最近的活動獎勵。轉發 1.2k。留言區有人說「營運是不是沒玩過自己的遊戲」。",deadline:2,ignore:{effects:{trust:-3},result:"迷因變成固定梗,每次公告底下都有人留。",habit:{ignored_players:1}},options:[{label:"官方幽默回應",ap:1,outcomes:[{p:.5,effects:{trust:6,players:2},result:"「泡麵是有誠意的」這句被截圖,反而被大量轉發。"},{p:.5,effects:{trust:-4},result:"被解讀為嘲諷玩家。"}]},{label:"認真整理玩家想要什麼",ap:2,outcomes:[{p:1,effects:{trust:2},reveal:"reward",result:"你把留言分類:大家其實很清楚自己想要什麼。"}]},{label:"不理會",ap:0,outcomes:[{p:1,effects:{trust:-1},result:"迷因沒有消失,但至少你沒有火上加油。",habit:{ignored_players:1}}]}],brief:"玩家做圖嘲笑活動獎勵太小氣。"},{id:"e_adhoc_chart",kind:"雜務",from:"企劃同事",weight:3,title:"「順便幫我拉個留存」",body:"「欸可以順便拉一下留存嗎?要分新舊玩家、分平台、分渠道、近 7 天近 30 天,明天要。」你說的順便,是整個下午。",deadline:1,ignore:{effects:{boss:-1},result:"同事:「喔沒事,我自己看看。」(他不會自己看。)"},options:[{label:"全部做完",ap:3,outcomes:[{p:1,effects:{boss:2},result:"同事收到後只說了「感謝」。三天後他又來了。",habit:{overtime:1}}]},{label:"只給最重要的兩張",ap:1,outcomes:[{p:.7,effects:{boss:1},result:"兩張就夠了,他本來也只會看一張。"},{p:.3,effects:{boss:-2},result:"同事:「不是這個維度啦。」"}]},{label:"請他自己查",ap:0,outcomes:[{p:1,effects:{boss:-1},result:"同事:「好喔……」(你聽出了什麼。)"}]}],brief:"同事臨時要你拉一堆數據報表。"},{id:"e_server_lag",kind:"技術",from:"玩家回報",weight:2,minDay:2,title:"晚間尖峰伺服器卡頓",body:"遊戲內世界頻道刷滿了「轉圈圈 ×50」。官方論壇出現新標題:「是不是又要補償了」。",deadline:1,ignore:{effects:{trust:-8,retention:-3},result:"隔天上線人數明顯少了一圈。",habit:{ignored_players:1}},options:[{label:"公告道歉並補償",ap:2,outcomes:[{p:1,effects:{trust:5,players:1},result:"補償剛好夠大家開心,又不會被下次期待。",habit:{transparency:1}}]},{label:"先公告「維護處理中」",ap:1,outcomes:[{p:.5,effects:{trust:2},result:"有交代就好。"},{p:.5,effects:{trust:-3},result:"「處理中」被解讀成「不知道」。"}]},{label:"等技術處理完再說",ap:0,outcomes:[{p:.4,result:"二十分鐘就好了,沒人記得。",habit:{ignored_players:1}},{p:.6,effects:{trust:-6,retention:-2},result:"兩小時後才有人想起公告。",habit:{ignored_players:1}}]}],brief:"遊戲尖峰時段卡頓,玩家在抱怨。"},{id:"e_competitor",kind:"輿情",from:"社群監控",weight:2,minDay:3,title:"競品開了週年慶,送 100 抽",body:"老闆在群組貼了連結,後面附一個 😐。論壇有人留言:「人家送一百抽。」",deadline:2,ignore:{effects:{players:-3},result:"你的玩家在下一次維護後,多了一些跑去別人家的。"},options:[{label:"緊急跟檔加碼福利",ap:3,outcomes:[{p:1,effects:{players:3,boss:3,trust:-1},result:"有撐住。代價是下次玩家期待你也送一百抽。",habit:{overtime:1}}]},{label:"強調自家獨有的特色",ap:1,outcomes:[{p:.5,effects:{players:2},result:"老玩家被喚醒了:「對,我們這裡有。」"},{p:.5,result:"公告很棒,但沒有 100 抽那麼有魅力。"}]},{label:"不理會",ap:0,outcomes:[{p:.5,result:"競品的聲量兩天後就過了。"},{p:.5,effects:{players:-4,retention:-2},result:"玩家短暫轉移,有些沒再回來。"}]}],brief:"對手遊戲在送大禮,玩家可能跑掉。"},{id:"e_vendor_report",kind:"原廠",from:"原廠窗口",day:15,weight:1,minDay:5,title:"原廠要求提交本月營運檢討",body:"「下週請提交本月營運檢討,並附改善計畫。」格式是他們的,欄位 47 個,其中 12 個是你沒有的資料。",deadline:2,ignore:{effects:{boss:-6},result:"原廠催了第二次,收件人多了你的老闆。"},options:[{label:"逐欄認真填寫",ap:3,outcomes:[{p:1,effects:{boss:4},result:"47 個欄位全部有填。其中 12 個你用了「待補」。"}]},{label:"只填重點欄位",ap:1,outcomes:[{p:.6,effects:{boss:1},result:"原廠沒有細看,收件確認。",habit:{sloppy_report:1}},{p:.4,effects:{boss:-3},result:"被退回補件,原因:「欄位 23 空白」。",habit:{sloppy_report:1}}]}],brief:"原廠要你交一份格式很多的月報。"},{id:"e_refund",kind:"客訴",from:"客服信箱",weight:2,minDay:3,title:"家長來信:孩子誤刷三個禮包",body:"信很長,情緒很重。內容大意:「孩子趁我睡著,用我的手機買了三個禮包,請問怎麼處理?」",deadline:2,ignore:{effects:{trust:-5},result:"對方在社群發了文,標題是「遊戲公司對家長不理不睬」。",habit:{ignored_players:1}},options:[{label:"依政策協助申請退款流程",ap:2,outcomes:[{p:1,effects:{trust:5},result:"這件事沒有成功不成功,只有處理得好不好。你選了好好處理。",habit:{transparency:1}}]},{label:"轉給客服,附上說明",ap:1,outcomes:[{p:1,effects:{trust:1},result:"客服接手了。回覆晚了一天,但有回。"}]},{label:"回覆「無法處理」",ap:0,outcomes:[{p:1,effects:{trust:-8},result:"這封回信被截圖轉發了 3000 次。",habit:{ignored_players:1}}]}],brief:"家長說小孩亂買禮包,想退款。"},{id:"e_cheater",kind:"數據",from:"後台數據",weight:2,minDay:4,title:"某帳號 24 小時獲得 500 倍資源",body:"你在後台看到一個帳號,一天內拿到了超過正常的資源。要嘛是天選之人,要嘛是漏洞。",deadline:2,ignore:{effects:{trust:-5,players:-2},result:"資源開始在市場流通,有人說「營運是不是睡著了」。"},options:[{label:"查證後再決定處置",ap:3,outcomes:[{p:.7,effects:{trust:4,boss:2},result:"是漏洞,已修補;你順手加了監控。"},{p:.3,effects:{boss:-2},result:"查了一圈,發現是原廠補償的發放錯誤。"}]},{label:"先凍結帳號",ap:1,outcomes:[{p:.5,effects:{trust:1},result:"確實是作弊,事情簡單處理掉了。"},{p:.5,effects:{trust:-5},result:"被凍結的是大額玩家,客服電話被打爆。"}]},{label:"先觀察",ap:0,outcomes:[{p:.5,result:"只是個案,事情自己過去了。"},{p:.5,effects:{players:-2,trust:-4},result:"資源通膨開始了。"}]}],brief:"後台看到有帳號的資源多得不正常。"},{id:"e_boss_idea",kind:"老闆",from:"林總",weight:2,minDay:3,title:"「全服送一隻限定神話角色!」",body:"「我想到一個點子,玩家一定爆炸開心!」你看了一眼營收曲線,開始思考這是誰的錢。",deadline:2,ignore:{effects:{boss:-3},result:"林總:「我昨天說的那個點子?」"},options:[{label:"用資料說服他",ap:2,outcomes:[{p:.7,effects:{boss:3,trust:1},result:"你展示三個類似案例,林總:「嗯……有道理。」",habit:{pushback:1}},{p:.3,effects:{boss:-4},result:"林總:「你這是質疑我嗎?」",habit:{pushback:1}}]},{label:"照辦",ap:0,outcomes:[{p:1,effects:{boss:3,trust:-3,players:3},result:"短期很爆炸,長期玩家問下次還送什麼。",habit:{yes_man:1}}]},{label:"提出折衷:抽獎送",ap:1,outcomes:[{p:1,effects:{boss:1,trust:1},result:"不是全服,但至少有人得到了。林總勉強接受。"}]}],brief:"老闆想把最稀有的角色免費送給所有人。"},{id:"e_data_dup",kind:"雜務",from:"原廠與後台",weight:2,minDay:2,title:"兩份報表的「日活躍」差了 4%",body:"一份來自後台,一份來自原廠。兩邊都很確定自己對,而你是那個需要說明差異的人。",deadline:2,ignore:{effects:{boss:-2},result:"兩份報表同時出現在同一次會議。"},options:[{label:"追查口徑差異",ap:3,outcomes:[{p:.8,effects:{boss:2,trust:1},result:"原來是時區與去重規則不同,你寫進備註。",habit:{overtime:1}},{p:.2,result:"追到一半被其他事打斷,但差異沒人再問。",habit:{overtime:1}}]},{label:"兩份都附註,交給主管判斷",ap:1,outcomes:[{p:1,effects:{boss:0},result:"你的備註很詳細,沒人看。"}]},{label:"挑一份交差",ap:0,outcomes:[{p:.5,result:"沒人發現。",habit:{sloppy_report:1}},{p:.5,effects:{boss:-5},result:"另一份剛好是對方在用的。",habit:{sloppy_report:1}}]}],brief:"兩份報表的玩家人數對不上。"},{id:"e_holiday",kind:"老闆",from:"林總",day:12,weight:1,minDay:6,title:"「月底週年慶,你先交個規劃」",body:"範圍:未定。預算:未定。時程:下週。你有的資訊:週年慶三個字。",deadline:2,ignore:{effects:{boss:-5},result:"林總:「週年慶規劃呢?」"},options:[{label:"先交一個大綱",ap:1,outcomes:[{p:1,effects:{boss:2},result:"大綱只有五行,但林總看起來很滿意。"}]},{label:"先要求釐清範圍與預算",ap:2,outcomes:[{p:.5,effects:{boss:3},result:"林總意識到自己還沒想清楚,給了你一個明確方向。",habit:{pushback:1}},{p:.5,effects:{boss:-3},result:"林總:「你先做,我再看。」",habit:{pushback:1}}]}],brief:"老闆要週年慶規劃,但什麼都沒說清楚。"},{id:"e_weekly",kind:"雜務",from:"林總",title:"週五了,週報請記得交",body:"林總在群組寫:「週報大家記得交喔 :)」那個笑臉的意思是:今天內。",deadline:1,ignore:{effects:{boss:-6},result:"週報沒交,林總的表情從笑臉變成句點。"},options:[{label:"認真撰寫",ap:2,outcomes:[{p:1,effects:{boss:3},result:"週報很完整。有人看到的機率是 40%。"}]},{label:"複製上週,改日期",ap:1,outcomes:[{p:.7,effects:{boss:1},result:"沒人發現。",habit:{sloppy_report:1}},{p:.3,effects:{boss:-8},result:"被發現連上週的錯字都一樣。",habit:{sloppy_report:1}}]},{label:"不交",ap:0,outcomes:[{p:1,effects:{boss:-6},result:"你的名字出現在未繳名單。"}]}],brief:"週五了,要交本週工作報告。"},{id:"e_audit",kind:"原廠",from:"原廠稽核窗口",weight:2,minDay:6,minDifficulty:"hard",title:"原廠稽核:抽查三個月前的活動紀錄",body:"「依合約規定,將抽查貴區過去活動的設定、公告與發放紀錄,請於兩日內提供。」其中一筆,是你上任前的活動。",deadline:2,ignore:{effects:{boss:-9,trust:-2},result:"原廠改為正式發函,收件人欄位寫了老闆的全名。"},options:[{label:"全部調出來,逐筆核對",ap:3,outcomes:[{p:1,effects:{boss:4,trust:1},result:"全部對得上,原廠:「感謝配合。」你發現其中一筆公告的錯字是前任留下的。"}]},{label:"只提供摘要",ap:1,outcomes:[{p:.5,effects:{boss:1},result:"原廠接受了摘要。"},{p:.5,effects:{boss:-5},result:"原廠:「請補充原始紀錄。」"}]},{label:"回覆「資料已歸檔,需要時間」",ap:0,outcomes:[{p:1,effects:{boss:-4},result:"原廠:「那我們三天後再來問。」"}]}],brief:"原廠要抽查你之前的活動紀錄。"},{id:"e_conflict",kind:"老闆",from:"林總 vs 原廠",weight:2,minDay:5,minDifficulty:"hard",title:"兩邊的要求互相衝突",body:"林總:「這季營收一定要衝。」原廠:「請降低玩家的花錢壓力,近期客訴偏多。」兩邊都說這是上級指示,而且都說「請盡快回覆」。",deadline:2,ignore:{effects:{boss:-5,trust:-3},result:"兩邊各自又寄了一封信,而且都把你列為收件人。"},options:[{label:"整理雙方訴求,做一份折衷簡報",ap:3,outcomes:[{p:.6,effects:{boss:3,trust:2},result:"你找到一個兩邊都勉強能接受的方案。"},{p:.4,effects:{boss:-3},result:"兩邊都覺得你偏向對方。"}]},{label:"照林總的方向走",ap:0,outcomes:[{p:1,effects:{boss:3,trust:-4},result:"老闆滿意,但玩家感覺到被催促營收。",habit:{yes_man:1}}]},{label:"照原廠的方向走",ap:0,outcomes:[{p:1,effects:{boss:-4,trust:4},result:"玩家鬆了一口氣,林總的表情則相反。"}]}]
